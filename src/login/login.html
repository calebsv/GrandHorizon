<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Hospedagem| Grand Horizon </title>
    <link rel="stylesheet" href="loginStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
        rel="stylesheet">

</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>



    <main>






        <form action="#" id="form">

            <div class="title">
                <i class="fa-solid fa-circle-user" style="color: hsl(0, 0%, 100%);" id="avatar"></i>
                <p>Grand Horizon </p>
            </div>


            <div class="input-box">

                <i class="fa-solid fa-user" style="color: hsl(0, 0%, 100%);"></i>
                <input type="text" id="name" placeholder="Nome completo">
            </div>

            <div class="input-box">

                <i class="fa-solid fa-at" style="color: hsl(0, 0%, 100%);"></i>
                <input type="email" id="email" placeholder="E-mail">
            </div>

            <div class="input-box">

                <i class="fa-solid fa-phone" style="color: hsl(0, 0%, 100%);"></i>
                <input type="tel" id="Telefone" placeholder="Telefone">
            </div>


            <div class="input-box">
                <i class="fa-solid fa-credit-card" style="color: hsl(0, 0%, 100%);"></i>

                <select class="input" name="pagamento" id="pagamento" required>

                    <option value="" selected disabled>Forma de pagamento</option>
                    <option value="pix">PIX</option>
                    <option value="credito">Cartão de Crédito</option>
                    <option value="debito">Cartão de Débito</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="boleto">Boleto Bancário</option>
                </select>


            </div>



            <div class="input-box">
                <i class="fa-solid fa-calendar-days" style="color: hsl(0, 0%, 100%);"></i>

                <select class="input" id="days" required>

                    <option value="" selected disabled>Período de hospedagem</option>
                    <option value="um">1 Dia</option>
                    <option value="dois">2 Dias</option>
                    <option value="debito">3 Dias</option>
                    <option value="semana">1 Semana</option>
                    <option value="mes">1 Mês</option>
                </select>


            </div>


            <div class="input-box">
                <i class="fa-solid fa-user-group" style="color: hsl(0, 0%, 100%);"></i>

                <select class="input" id="people" required>

                    <option value="" selected disabled>Qantidade de hópedes</option>
                    <option value="um">1 hóspede</option>
                    <option value="dois">2 hóspedes</option>
                    <option value="debito">3 hóspedes</option>
                    <option value="semana">4 hóspedes</option>

                </select>


            </div>

            <div class="input-box">
                <i class="fa-solid fa-house" style="color: hsl(0, 0%, 100%);"></i>

                <select class="input" id="hospedagem" required>

                    <option value="" selected disabled>Opções de hospedagem</option>
                    <option value="um">Standard</option>
                    <option value="dois">Deluxe</option>
                    <option value="debito">Suíte</option>
                    <option value="semana">Familiar</option>

                </select>


            </div>




            <input type="submit" id="Login-btn" value="Solicitar reserva">



        </form>

    </main>
    <script src="loginScript.js"></script>
</body>

</html>
